name: Trigger auto deployment for kirofactory-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/kirofactory-api-AutoDeployTrigger-f3973563-3eb9-4924-ac01-a020076218b5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KIROFACTORYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KIROFACTORYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KIROFACTORYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: kirofactory.azurecr.io
          registryUsername: ${{ secrets.KIROFACTORYAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.KIROFACTORYAPI_REGISTRY_PASSWORD }}
          containerAppName: kirofactory-api
          resourceGroup: SandboxForRM
          imageToBuild: kirofactory.azurecr.io/kirofactory-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


