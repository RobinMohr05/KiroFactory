name: Trigger auto deployment for vibecode-heaven-api

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC JWT Token
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KIROFACTORYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KIROFACTORYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KIROFACTORYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy vibecode-heaven-api
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./Dockerfile
          registryUrl: kirofactory.azurecr.io
          registryUsername: ${{ secrets.KIROFACTORYAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.KIROFACTORYAPI_REGISTRY_PASSWORD }}
          containerAppName: kirofactory-api
          resourceGroup: SandboxForRM
          imageToBuild: kirofactory.azurecr.io/kirofactory-api:${{ github.sha }}

      # The action above only updates the image on the existing Container App
      # (an image-only `az containerapp update`) — it does NOT apply
      # infra/main.bicep or infra/modules/container-app.bicep. Any change made
      # only in the .bicep files (new secret, new env var, scale rule, probe,
      # etc.) would otherwise silently never reach the live resource, no matter
      # how many times this workflow runs. See KiroFactory task #1691 — this is
      # exactly how the KIRO_API_KEY fix (task #1686) failed to take effect.
      # Re-applying the bicep template here, right after every image build,
      # closes that gap: every push to main both ships the new image AND
      # reconciles the live resource to the current template/params.
      - name: Apply container-app.bicep (env vars, secrets, scaling, probes)
        run: ./infra/deploy-app.sh --tag "${{ github.sha }}"
        env:
          NEO4J_URI: ${{ secrets.KIROFACTORYAPI_NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.KIROFACTORYAPI_NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.KIROFACTORYAPI_NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.KIROFACTORYAPI_NEO4J_DATABASE }}
          JWT_SECRET: ${{ secrets.KIROFACTORYAPI_JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.KIROFACTORYAPI_ENCRYPTION_KEY }}
          ACA_WORKER_SECRET: ${{ secrets.KIROFACTORYAPI_ACA_WORKER_SECRET }}
          KIRO_API_KEY: ${{ secrets.KIROFACTORYAPI_KIRO_API_KEY }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.KIROFACTORYAPI_AZURE_DEVOPS_EXT_PAT }}

  build-and-push-worker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4
        with:
          # Full history: github.event.before can point further back than
          # HEAD~1 for multi-commit pushes, and a shallow clone would make
          # that diff fail.
          fetch-depth: 0

      - name: Check if worker files changed
        id: worker-changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          # On the first push to a new branch, github.event.before is all-zeros
          # and there's nothing to diff against — fall back to the previous commit.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="HEAD~1"
          fi
          # Diff against the pre-push SHA (not just HEAD~1) so multi-commit
          # pushes are covered in full, not just the last commit.
          if git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" | grep -q '^worker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        if: steps.worker-changes.outputs.changed == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KIROFACTORYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KIROFACTORYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KIROFACTORYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push kirofactory-worker
        if: steps.worker-changes.outputs.changed == 'true'
        run: |
          az acr build \
            --registry kiroFactory \
            --image kirofactory-worker:${{ github.sha }} \
            --image kirofactory-worker:latest \
            --file worker/.devcontainer/Dockerfile \
            worker/
